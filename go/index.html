function imageKey(w){return `${state.listId}:${w.id}`}
function imageUrl(w){return IMAGE_URLS[imageKey(w)]||generatedImageUrl(w,imageSeed(w.term))}
const FALLBACK_IMAGES=Array.from({length:6},(_,i)=>`assets/fallback-car-${i+1}.png`);
const fallbackChoices=new Map(),resolvedImages=new Map();
function fallbackImage(key){if(!fallbackChoices.has(key))fallbackChoices.set(key,FALLBACK_IMAGES[Math.floor(Math.random()*6)]);return fallbackChoices.get(key)}
function isSearchImage(url){try{return /(^|\.)loremflickr\.com$/.test(new URL(url,location.href).hostname)}catch(e){return false}}
async function resolveSearchImage(url,key){
 if(!resolvedImages.has(url))resolvedImages.set(url,(async()=>{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
  try{
   const response=await fetch(url,{signal:controller.signal});
   const path=new URL(response.url).pathname;
   // Only accept identifiable Flickr photo filenames, never a provider placeholder.
   if(!response.ok||!response.headers.get("content-type")?.startsWith("image/")||!/\d{6,}_[a-f0-9]{8,}/i.test(path)||/tomboli|default|placeholder/i.test(path))return null;
   return URL.createObjectURL(await response.blob())
  }catch(e){return null}finally{clearTimeout(timer)}
 })());
 return await resolvedImages.get(url)||fallbackImage(key)
}
function useFallbackImage(img){img.onerror=null;img.src=img.dataset.fallback;img.style.objectFit="contain";img.style.background="#fff"}
function wordPicture(w,className){
 let key=imageKey(w),url=imageUrl(w),fallback=fallbackImage(key),search=isSearchImage(url);
 return `<img class="${className}" src="${esc(search?fallback:url)}" data-fallback="${esc(fallback)}" ${search?`data-search-image="${esc(url)}" data-image-key="${esc(key)}" style="object-fit:contain;background:#fff"`:""} alt="Afbeelding bij ${esc(w.term)}" loading="lazy" onerror="useFallbackImage(this)">`
}
function wordImage(w){let img=wordPicture(w,"word-image");return state.view==="study"&&state.mode==="flashcard"?`<div class="flashcard-image-wrap">${img}${historyControls()}</div>`:img}
function wordThumbnail(w){return wordPicture(w,"word-thumbnail")}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function localizeKid(k){return k==="哥哥"?"Oudste":k==="弟弟"?"Jongste":k}
function kidLabel(k){return k==="Oudste"?"Felix · Groep 6":k==="Jongste"?"Max · Groep 4":k}
function normalizeWord(w){return {id:w.id||uid(),term:w.term||"",definition:w.definition||"",explanationNl:w.explanationNl||w.nlExplanation||"",exampleNl:w.exampleNl||w.nlExample||"",exampleZh:w.exampleZh||w.zhExample||"",stats:w.stats||{correct:0,wrong:0,last:0}}}
function load(){

  if(raw){let d=JSON.parse(raw);d.lists=(d.lists||[]).map(l=>({...l,kid:localizeKid(l.kid)}));localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d}

  if(old){let d=JSON.parse(old);d.lists=(d.lists||[]).map(l=>({...l,kid:localizeKid(l.kid),words:(l.words||[]).map(normalizeWord)}));localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d}
 }catch(e){}

}

async function changeImage(wordId){
 let l=getList(),w=l?.words.find(x=>x.id===wordId);if(!l||!w)return;
 let random=Math.floor(Math.random()*900000000)+100000000;
 let key=imageKey(w),previous=fallbackImage(key),choices=FALLBACK_IMAGES.filter(x=>x!==previous);
 fallbackChoices.set(key,choices[Math.floor(Math.random()*choices.length)]);
 let candidate=generatedImageUrl(w,random),resolved=await resolveSearchImage(candidate,key);
 let url=resolved.startsWith("assets/")?resolved:candidate;
 const {error}=await db.from("word_images").upsert({word_list_id:l.id,word_id:wordId,image_url:url},{onConflict:"word_list_id,word_id"});
 if(error){console.error(error);alert("De nieuwe afbeelding kon niet worden opgeslagen. Probeer het opnieuw.");return false}
 IMAGE_URLS[`${l.id}:${wordId}`]=url;render();return true
}
function loadImageFile(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("image"))};img.src=url})}
async function compressImage(file){
 if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw new Error("type");
 if(file.size>15*1024*1024)throw new Error("large");
 let image=await loadImageFile(file),sourceWidth=image.naturalWidth||image.width,sourceHeight=image.naturalHeight||image.height;
 for(let [max,quality] of [[1600,.82],[1400,.75],[1200,.68]]){
  let scale=Math.min(1,max/Math.max(sourceWidth,sourceHeight)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(sourceWidth*scale));canvas.height=Math.max(1,Math.round(sourceHeight*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);
  let blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));if(blob&&blob.size<=1900000)return blob;
 }
 throw new Error("compressed-large")
}
async function uploadCustomImage(wordId,file){
 let l=getList(),w=l?.words.find(x=>x.id===wordId);if(!l||!w||!file)return false;
 let image;try{image=await compressImage(file)}catch(error){let message=error.message==="type"?"Kies een JPG-, PNG- of WebP-afbeelding.":error.message==="large"?"Deze foto is te groot. Kies een bestand kleiner dan 15 MB.":"Deze afbeelding kan niet klein genoeg worden gemaakt. Kies een andere foto.";alert(message);return false}
 let path=`${l.id}/${w.id}-${Date.now()}.jpg`;
 const {error:uploadError}=await db.storage.from(IMAGE_BUCKET).upload(path,image,{contentType:"image/jpeg",cacheControl:"31536000",upsert:false});
 if(uploadError){console.error(uploadError);alert("Uploaden mislukt. Controleer eerst of de opslag voor afbeeldingen is ingesteld.");return false}
 let {data:urlData}=db.storage.from(IMAGE_BUCKET).getPublicUrl(path),url=urlData.publicUrl;
 const {error:saveError}=await db.from("word_images").upsert({word_list_id:l.id,word_id:wordId,image_url:url},{onConflict:"word_list_id,word_id"});
 if(saveError){console.error(saveError);alert("De afbeelding is geüpload, maar kon niet aan dit woord worden gekoppeld.");return false}
 IMAGE_URLS[`${l.id}:${wordId}`]=url;render();return true
}

function parse(text){
 return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{
  let p=line.includes("\t")?line.split("\t"):line.split(" — ");
  if(p.length<2)p=line.split(/\s+-\s+/);
  return {term:(p[0]||"").trim(),definition:(p[1]||"").trim(),explanationNl:(p[2]||"").trim(),exampleNl:(p[3]||"").trim(),exampleZh:(p[4]||"").trim()}
 }).filter(x=>x.term)
}

 document.querySelectorAll("[data-change-image]").forEach(x=>x.onclick=async()=>{if(x.disabled)return;x.disabled=true;x.textContent="Bezig...";let changed=await changeImage(x.dataset.changeImage);if(!changed){x.disabled=false;x.textContent="↻ Nieuwe🖼️"}});
 let customImageFile=document.getElementById("customImageFile"),uploadWordId=null;
 document.querySelectorAll("[data-upload-image]").forEach(x=>x.onclick=()=>{uploadWordId=x.dataset.uploadImage;customImageFile?.click()});
 customImageFile?.addEventListener("change",async()=>{let file=customImageFile.files?.[0];if(!file||!uploadWordId)return;let button=document.querySelector(`[data-upload-image="${uploadWordId}"]`);if(button){button.disabled=true;button.textContent="Bezig..."}await uploadCustomImage(uploadWordId,file);uploadWordId=null;customImageFile.value=""});
 document.getElementById("newList")?.addEventListener("click",()=>{state.modal="new";render()});
 document.getElementById("back")?.addEventListener("click",()=>{state.view="home";render()});
 document.getElementById("editWords")?.addEventListener("click",()=>{state.modal="edit";render()});
 document.getElementById("deleteList")?.addEventListener("click",()=>{if(confirm("Weet je zeker dat je deze woordenlijst wilt verwijderen?")){DATA.lists=DATA.lists.filter(x=>x.id!==state.listId);save();state.view="home";render()}});
 document.querySelectorAll("[data-mode]").forEach(x=>x.onclick=()=>start(x.dataset.mode));
 document.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{let l=getList();l.words=l.words.filter(w=>w.id!==x.dataset.del);save();render()});
 document.getElementById("exit")?.addEventListener("click",()=>{clearCelebration();stopSound();stopStudyMusic();state.view="detail";state.session=null;render()});
 document.getElementById("restart")?.addEventListener("click",()=>start(state.mode));
 if(state.view!=="study")return;
 document.getElementById("previousQuestion")?.addEventListener("click",(event)=>{event.stopPropagation();navigateQuestion(-1);});
 document.getElementById("forwardQuestion")?.addEventListener("click",(event)=>{event.stopPropagation();if(historyIndex!==null)navigateQuestion(1);else if(state.mode==="mc"&&state.session?.answered&&state.session?.celebrate)nextMcQuestion();});
 if(historyIndex!==null){
  document.querySelectorAll("#known,#unknown,#next,.feedback-overlay,.celebration").forEach(x=>x.remove());
  document.querySelectorAll("[data-opt]").forEach(x=>x.disabled=true);
  document.querySelectorAll(".mc > p").forEach(x=>x.remove());
  document.getElementById("fc")?.addEventListener("click",()=>{let s=shownSession();s.flip=!s.flip;render()});
  return
 }
 let s=state.session;
 if(state.mode==="flashcard"){document.getElementById("fc")?.addEventListener("click",()=>{s.flip=!s.flip;render()});document.getElementById("known")?.addEventListener("click",()=>{rememberQuestion();playSound("remembered");s.known++;s.queue.shift();s.flip=false;finishIf(s);render()});document.getElementById("unknown")?.addEventListener("click",()=>{rememberQuestion();playSound("review");s.review.push(s.queue.shift());s.flip=false;finishIf(s);render()})}
 if(state.mode==="mc"){document.querySelectorAll("[data-opt]").forEach(x=>x.onclick=()=>{let i=+x.dataset.opt;s.answered=true;s.selected=i;if(s.options[i].ok){s.correct++;s.celebrate=true;playSoundSequence(["correct","rick"],.7);render();clearCelebration();celebrationTimer=setTimeout(nextMcQuestion,6000)}else{playSound("wrong",.55);s.review.push(s.queue[0]);render()}});document.getElementById("next")?.addEventListener("click",nextMcQuestion)}
}
render();loadCloudLists();
</script>
</body>
</html>
